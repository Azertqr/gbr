name: Build NyxMenuGBR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ARM64
    runs-on: macos-14

    steps:
      # 1. Récupérer les fichiers du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Vérifier les outils Apple
      - name: Check build environment
        run: |
          xcodebuild -version
          clang++ --version
          xcrun --sdk iphoneos --show-sdk-path

      # 3. Télécharger l'IPA
      - name: Download Grand Battle Royale IPA
        run: |
          mkdir -p output

          curl -fL \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "https://pixeldrain.com/api/file/M3CmVwZ3" \
            -o output/GrandBattleRoyale.ipa

          test -s output/GrandBattleRoyale.ipa

          echo "=== IPA Downloaded ==="
          ls -lh output/GrandBattleRoyale.ipa
          file output/GrandBattleRoyale.ipa

      # 4. Vérifier le fichier source
      - name: Check Tweak.mm
        run: |
          if [ ! -f "Tweak.mm" ]; then
            echo "ERROR: Tweak.mm not found!"
            exit 1
          fi

          echo "Tweak.mm found"

      # 5. Compiler la bibliothèque iOS
      - name: Compile NyxMenuGBR.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang++ \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -Wno-deprecated-declarations \
            -framework UIKit \
            -framework Foundation \
            -install_name @rpath/NyxMenuGBR.dylib \
            -o output/NyxMenuGBR.dylib \
            Tweak.mm

          codesign -f -s - output/NyxMenuGBR.dylib

          echo "=== Build Result ==="
          file output/NyxMenuGBR.dylib
          ls -lh output/NyxMenuGBR.dylib

      # 6. Vérifier les fichiers générés
      - name: Verify outputs
        run: |
          test -s output/NyxMenuGBR.dylib
          test -s output/GrandBattleRoyale.ipa

          echo "=== Output Files ==="
          ls -lh output/

      # 7. Envoyer la dylib dans les artifacts
      - name: Upload NyxMenuGBR
        uses: actions/upload-artifact@v4
        with:
          name: NyxMenuGBR
          path: output/NyxMenuGBR.dylib
          if-no-files-found: error

      # 8. Envoyer l'IPA dans les artifacts
      - name: Upload Grand Battle Royale IPA
        uses: actions/upload-artifact@v4
        with:
          name: GrandBattleRoyale-IPA
          path: output/GrandBattleRoyale.ipa
          if-no-files-found: error
