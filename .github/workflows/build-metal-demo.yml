name: Build standalone ImGui Metal demo

on:
  workflow_dispatch:
  push:
    paths:
      - "Demo/**"
      - ".github/workflows/build-metal-demo.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch Dear ImGui
        run: |
          git clone --depth 1 --branch v1.91.9b https://github.com/ocornut/imgui.git third_party/imgui

      - name: Build arm64 iOS dynamic library
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          clang++ -x objective-c++ -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -std=c++17 -fobjc-arc -O2 \
            -fvisibility=hidden -dynamiclib \
            -IDemo -Ithird_party/imgui -Ithird_party/imgui/backends \
            Demo/ImGuiDrawView.mm \
            third_party/imgui/imgui.cpp \
            third_party/imgui/imgui_draw.cpp \
            third_party/imgui/imgui_tables.cpp \
            third_party/imgui/imgui_widgets.cpp \
            third_party/imgui/backends/imgui_impl_metal.mm \
            -framework UIKit -framework Foundation -framework Metal \
            -framework MetalKit -framework QuartzCore -framework CoreGraphics \
            -install_name @rpath/StandaloneImGuiDemo.dylib \
            -o build/StandaloneImGuiDemo.dylib

          file build/StandaloneImGuiDemo.dylib
          xcrun lipo -info build/StandaloneImGuiDemo.dylib

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneImGuiDemo-arm64
          path: build/StandaloneImGuiDemo.dylib
          if-no-files-found: error
          retention-days: 14
